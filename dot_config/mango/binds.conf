# 全部按键绑定

# ── 启动应用 / 系统 / 截图 ──
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER,comma,spawn,noctalia msg settings-toggle
bind=SUPER,t,spawn,foot
bind=SUPER,e,spawn,dolphin
bind=SUPER,v,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,y,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER,x,spawn,noctalia msg panel-toggle session

bind=NONE,Print,spawn,noctalia msg screenshot-region
bind=NONE+CTRL,Print,spawn,noctalia msg screenshot-fullscreen
bind=NONE+SHIFT,Print,spawn,noctalia msg screenshot-window

bind=SUPER+ALT,l,spawn,noctalia msg session lock

bind=SUPER+SHIFT,r,reload_config
bind=SUPER,m,quit
bind=SUPER,q,killclient,

# ── 焦点 ──
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev

# ── 移动窗口 ──
bind=SUPER+SHIFT,k,move_client,up
bind=SUPER+SHIFT,j,move_client,down
bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,l,move_client,right

# ── 浮动 / 全屏 / 全局 / 总览 ──
bind=SUPER,g,toggleglobal,
bind=SUPER+SHIFT,o,togglejump,
bind=SUPER+SHIFT,space,togglefloating,
bind=SUPER+SHIFT,t,togglefloating,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER+ALT,f,togglefakefullscreen,
bind=SUPER+CTRL,o,toggleoverlay,
bind=SUPER,o,toggleoverview
bind=SUPER,Tab,toggleoverview
bind=SUPER,i,viewtoleft,0
bind=SUPER,u,viewtoright,0

# ── 尺寸 ──
bind=SUPER,minus,resizewin,-50,+0
bind=SUPER,equal,resizewin,+50,+0
bind=SUPER+SHIFT,minus,resizewin,+0,-50
bind=SUPER+ALT+SHIFT,Left,movewin,-50,+0
bind=SUPER+ALT+SHIFT,Right,movewin,+50,+0
bind=SUPER+ALT+SHIFT,Up,movewin,+0,-50
bind=SUPER+ALT+SHIFT,Down,movewin,+0,+50

# ── 布局 ──
bind=SUPER,n,switch_layout
bind=SUPER,r,switch_proportion_preset,
bind=SUPER+CTRL+ALT,Left,scroller_stack,left
bind=SUPER+CTRL+ALT,Right,scroller_stack,right
bind=SUPER+CTRL+ALT,Up,scroller_stack,up
bind=SUPER+CTRL+ALT,Down,scroller_stack,down

# ── 标签 ──
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,I,tagtoleft,0
bind=SUPER+SHIFT,U,tagtoright,0

# ── 显示器 ──
bind=SUPER+CTRL,H,focusmon,left
bind=SUPER+CTRL,L,focusmon,right
bind=SUPER+CTRL,K,focusmon,up
bind=SUPER+CTRL,J,focusmon,down
bind=SUPER+CTRL+SHIFT,H,tagmon,left
bind=SUPER+CTRL+SHIFT,L,tagmon,right
bind=SUPER+CTRL+SHIFT,K,tagmon,up
bind=SUPER+CTRL+SHIFT,J,tagmon,down

# ── 间距 ──
bind=SUPER+CTRL,equal,incgaps,1
bind=SUPER+CTRL,minus,incgaps,-1
bind=SUPER+CTRL,g,togglegaps

# ── 鼠标 / 手势 ──
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewtoleft,0
gesturebind=none,left,4,viewtoright,0
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview

bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down 5
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up 5
bind=NONE,XF86AudioPrev,spawn,noctalia msg media previous
bind=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bind=NONE,XF86AudioNext,spawn,noctalia msg media next
bind=NONE,XF86TouchpadOn,toggle_trackpad_enable,
bind=NONE,XF86TouchpadOff,toggle_trackpad_enable,

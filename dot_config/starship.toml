"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[jj_bookmark]
format = "[$bookmark(@$remote)$diverged( \\(+$overflow_count others\\))]($style)"
style = "bright-black"

[jj_status]
format = "[[(*$all)](218)]($style)"
style = "cyan"
conflicted = "​"
description_empty = ""
description_present = ""
hidden = "​"
immutable = "​"
added = "​"
copied = ""
deleted = "​"
modified = "​"
renamed = "​"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []

